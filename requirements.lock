# Dependency lockfile for resume-review.
#
# This pins the exact environment the deterministic test suite was last run
# against: 1068 passed, 15 skipped, 0 failed on
#   Python 3.14.0, Windows 11 Pro (26200), `python -m pytest`.
#
# Relationship to pyproject.toml: pyproject expresses the *compatibility
# envelope* (for example "fastapi>=0.141,<0.142"). This file records the single
# resolved version inside that envelope. A version may only move here after the
# full suite has been re-run and the counts above updated. Do not hand-edit a
# pin to "pick up a fix" -- change the envelope in pyproject.toml, resolve, and
# re-test.
#
# Scope: the whole tested environment, runtime and test-only together, because
# the release evidence is produced by running the suite in one environment. The
# two sections below label which is which; both are installed for a test run.
#
# Install:  .venv/Scripts/python.exe -m pip install -r requirements.lock
#
# Known declaration gap, closed: jsonschema is listed below as a test dependency
# and is now declared in pyproject.toml's ``dev`` extra. The one test that uses it
# (tests/unit/test_web_assets.py, manifest schema validation) guards with
# pytest.importorskip, so while it was undeclared a clean install made that check
# SILENTLY SKIP and report a pass. The declaration is what makes the pass mean
# something, so keep the two in step.

